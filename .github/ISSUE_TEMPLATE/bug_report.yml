name: Bug report
description: Report a reproducible problem with CloudMeet
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove secrets, user data, and production identifiers from logs and screenshots.
        Report security issues through the private advisory link instead.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: Commit SHA, release tag, or deployment URL
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, browser, Cloudflare setup, and relevant integration.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets and private user data from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
